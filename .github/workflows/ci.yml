name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - working-directory: backend
        run: python manage.py check --settings=config.test_settings
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - working-directory: backend
        run: python manage.py test --settings=config.test_settings
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt
      - name: Production settings, static files, and WSGI smoke test
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-production-check-key-8cH4kL2pQ9xN6mR3vT7yW1zB5dF0sJ8uA
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: api.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://api.example.test
          DB_NAME: unused_for_static_smoke
          DB_USER: unused_for_static_smoke
          DB_PASSWORD: unused_for_static_smoke
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput
          python -c "from config.wsgi import application; assert application is not None"

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workforce_matching_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_matching_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: workforce-matching-ci-postgres-key-never-use-in-production-123456789
      DB_NAME: workforce_matching_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      CV_PDF_ENGINE: basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - working-directory: backend
        run: python manage.py migrate --settings=config.ci_postgres_settings --noinput
      - working-directory: backend
        run: python manage.py test --settings=config.ci_postgres_settings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
